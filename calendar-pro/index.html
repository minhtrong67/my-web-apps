    <!-- Khởi động: vẽ đúng nền sáng/tối NGAY từ khung hình đầu tiên, trước cả khi file CSS/JS của app tải xong.
         (Màn hình chờ này nằm trong #root và tự biến mất khi React vẽ lần đầu.) -->
    <style id="boot-style">
      html { background: #FFF8F7; color-scheme: light; --boot-fg: #BE003A; }
      html.dark { background: #1D1011; color-scheme: dark; --boot-fg: #FFB2B7; }
      html, body, #root { height: 100%; margin: 0; }
      .boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: inherit; color: var(--boot-fg); }
      .boot svg { width: 72px; height: 72px; animation: boot-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s both, boot-spin 6s linear infinite; }
      @keyframes boot-in { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }
      @keyframes boot-spin { to { rotate: 360deg; } }
      @media (prefers-reduced-motion: reduce) { .boot svg { animation: none; } }
    </style>
    <script>
      (function () {
        var d = document.documentElement;
        var s = {};
        try {
          // Đọc cài đặt mới; nếu chưa có thì dùng khoá cũ ("lich-pro") của phiên bản trước khi đổi tên project
          s = JSON.parse(localStorage.getItem('calendar-pro:settings') || localStorage.getItem('lich-pro:settings') || '{}') || {};
        } catch (e) {}
        var dark = false;
        try {
          // Tính ngoài khối try ở trên: dù localStorage bị chặn (chế độ riêng tư...) vẫn theo đúng hệ điều hành
          dark = s.themeMode === 'dark' || ((s.themeMode || 'system') === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {}
        /* @surfaces:start */ var SURF = {"rose":["#fff8f7","#1d1011","#be003a","#ffb2b7"],"mono":["#f9f9f9","#131313","#000000","#ffffff"],"do":["#fff8f7","#1d100e","#c00009","#ffb4a9"],"vang":["#fff8f3","#191207","#7d5700","#ffba30"],"xanh-la":["#f3fcef","#0d150e","#006d32","#00e470"],"xanh-duong":["#f9f9ff","#0f141b","#005faf","#a6c8ff"],"tim":["#fff7ff","#16121a","#8100f5","#d8baff"],"hong":["#fff8f8","#1c1013","#b90062","#ffb1c7"],"cam":["#fff8f5","#1c110a","#994700","#ffb68a"],"ngoc-lam":["#f0fcf9","#0a1514","#006a62","#00dece"]}; /* @surfaces:end */
        var ids = ['mono', 'rose', 'do', 'vang', 'xanh-la', 'xanh-duong', 'tim', 'hong', 'cam', 'ngoc-lam'];
        var color = s.color === 'm3' ? 'rose' : (ids.indexOf(s.color) > -1 ? s.color : 'rose');
        if (s.dailyColorRotation) {
          var n = new Date();
          color = ids[(n.getFullYear() * 372 + n.getMonth() * 31 + n.getDate()) % ids.length];
        }
        var scales = { nho: 0.925, vua: 1, lon: 1.1, 'rat-lon': 1.1 };
        d.classList.toggle('dark', dark);
        d.style.colorScheme = dark ? 'dark' : 'light';
        d.setAttribute('data-color', color);
        var sp = (typeof SURF !== 'undefined' && SURF[color]) || null;
        if (sp) {
          // Nền + màu splash đúng theo màu chủ đạo và sáng/tối đã lưu — ngay khung hình đầu tiên
          d.style.backgroundColor = dark ? sp[1] : sp[0];
          d.style.setProperty('--boot-fg', dark ? sp[3] : sp[2]);
        }
        if (scales[s.fontSize]) d.style.setProperty('--font-scale', scales[s.fontSize]);
        try {
          // Chỉ giữ 1 thẻ theme-color (bỏ media) để thanh trạng thái theo đúng giao diện của app, không theo hệ điều hành
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 1; i < metas.length; i++) metas[i].parentNode.removeChild(metas[i]);
          if (metas[0]) {
            metas[0].removeAttribute('media');
            metas[0].setAttribute('content', sp ? (dark ? sp[1] : sp[0]) : (dark ? '#1D1011' : '#FFF8F7'));
          }
        } catch (e) {}
      })();
    </script>
